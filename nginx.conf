worker_processes auto;
error_log stderr warn;
pid /var/run/nginx.pid;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    sendfile on;
    keepalive_timeout 65;
    server_names_hash_bucket_size 128;
    map_hash_bucket_size 128;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/x-component;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # host -> 127.0.0.1:<port>, written by the agent on every swap.
    map $host $devver_upstream {
        include /app/nginx/routes.map;
    }

    # Port 80 only serves previews. The agent API stays on 8080 (cluster-internal).
    server {
        listen 80 default_server;
        server_name _;

        location = /__devver/context {
            proxy_pass http://127.0.0.1:8080/__devver/context;
            proxy_set_header Host $host;
        }

        location / {
            if ($devver_upstream = "") {
                return 404;
            }
            proxy_pass http://$devver_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 600s;
            # sub_filter cannot rewrite compressed bodies; nginx gzips after it.
            proxy_set_header Accept-Encoding "";
            add_header X-Devver-Upstream $devver_upstream always;
            include /app/nginx/widget.conf;
        }
    }
}
