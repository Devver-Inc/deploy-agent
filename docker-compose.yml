services:
  deploy-agent:
    image: ghcr.io/devver-inc/deploy-agent:${DEPLOY_AGENT_VERSION:-v0.1.0}
    container_name: deploy-agent
    ports:
      - "3080:80"
    volumes:
      - devver-app:/app
      # Caches stay on devver-app: separate volumes break bun's hardlinks (5x slower install).
    environment:
      - DEVVER_SECRET
      - DEVVER_PROJECT_ID
      - DEVVER_ORGANIZATION_ID
      - DEVVER_BACKEND_URL
      - DEVVER_GIT_SSH_HOST
      - DEVVER_GIT_GATEWAY_PUBLIC_KEY
      - DEVVER_PREVIEW_DOMAIN
      - NODE_ENV
      - DEVVER_WIDGET_URL
      - DEVVER_MONGO_CONNECTION_STRING

volumes:
  devver-app:
